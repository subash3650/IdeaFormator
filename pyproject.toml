[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pain-intelligence-engine"
version = "0.1.0"
description = "Large-scale NLP platform for discovering pain points and startup opportunities."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "typer[all]>=0.12.0",
    "loguru>=0.7.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "langdetect>=1.0.9",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
explorer = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pain-intelligence = "pain_intelligence.cli:app"

[tool.setuptools.packages.find]
include = ["pain_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
