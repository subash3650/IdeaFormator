services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideaformator-api
    ports:
      - "8000:8000"
    environment:
      - API_ENVIRONMENT=production
      - API_SECRET_KEY=${API_SECRET_KEY:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,https://app.ideaformator.com
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ideaformator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ideaformator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
