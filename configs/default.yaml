paths:
  raw_datasets_dir: "Datasets"
  outputs_dir: "outputs"
  removed_dir: "outputs"

processing:
  chunk_size: 10000
  batch_size: 5000
  min_document_length: 10
  supported_languages: []
  random_seed: 42

output:
  formats:
    - "parquet"
    - "csv"

preprocessing:
  fix_encoding: true
  remove_html: true
  normalize_unicode: true
  normalize_whitespace: true
  remove_urls: true
  process_emojis: true
  lowercase: false
  remove_duplicates: true
  detect_language: false
  max_document_length: 100000

intelligence:
  debug: false
  output_dir: "reports"
  sampling:
    enabled: false
    max_documents: 100000
    strategy: "stratified"
    strata_column: "platform"
  confidence:
    exact_dictionary_match: 0.95
    pattern_match: 0.85
    fuzzy_match: 0.65
    heuristic: 0.55
    statistical: 0.45
    evidence_base: 0.70
    signal_threshold: 0.80
  extraction:
    ngram_min_frequency: 5
    ngram_max_features: 100
    keyword_max_features: 100
    entity_min_mentions: 3
    pattern_min_confidence: 0.5
  evidence:
    min_observation_count: 3
    min_document_count: 3
    top_snippets_count: 5
  signals:
    min_document_count: 10
    max_avg_rating: 3.0
    min_confidence: 0.7
    entity_only_filtering: true
    generic_phrase_filtering: true
  visualization:
    theme: "plotly_dark"
    width: 1200
    height: 600
  dashboard:
    host: "localhost"
    port: 8501

embedding:
  provider: "sentence_transformers"
  model: "all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 64
  device: "cpu"
  normalize: true
  store_text: false
  output_dir: "pain_intelligence/knowledge/assets/phase2"
  source_paths:
    observation: "pain_intelligence/knowledge/assets/observations.parquet"
    evidence: "pain_intelligence/knowledge/assets/evidence.parquet"
    problem_signal: "pain_intelligence/knowledge/assets/problem_signals.parquet"

similarity:
  metric: "cosine"
  similarity_threshold: 0.82
  top_k: 20
  batch_size: 1024
  normalize_scores: true
  minimum_confidence: 0.0
  store_bidirectional: false
  output_directory: "pain_intelligence/knowledge/assets/phase2"
  version: "1.0"
  embedding_model: "all-MiniLM-L6-v2"
  embedding_provider: "sentence_transformers"
  embedding_dimension: 384
  allowed_relationships:
    observation:
      - observation
      - evidence
      - problem_signal
    evidence:
      - evidence
      - problem_signal
    problem_signal:
      - problem_signal

logging:
  level: "INFO"
  file: "outputs/pipeline.log"
  rotation: "10 MB"
  retention: "7 days"

clustering:
  provider: "connected_components"
  minimum_cluster_size: 3
  maximum_cluster_size: 500
  relationship_threshold: 0.82
  quality_threshold: 0.70
  remove_singletons: true
  merge_small_clusters: true
  deterministic: true
  output_directory: "pain_intelligence/knowledge/assets/phase2"
  version: "1.0"
  quality_weights:
    cohesion: 0.35
    density: 0.25
    separation: 0.20
    connectivity: 0.20
